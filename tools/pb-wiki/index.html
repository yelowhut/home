<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phantom Brigade — База снаряжения</title>
<style>
:root{
  --bg:#0e1116; --bg2:#161b22; --bg3:#1c232d; --bg4:#232c38;
  --line:#2a3340; --line2:#374350;
  --txt:#e6edf3; --dim:#9aa7b4; --dim2:#6e7a88;
  --accent:#ff8a3d; --accent2:#4fc3f7;
  --r1:#dbe4ee; --r2:#8fe28f; --r3:#6cc6f7;
  --good:#7fd88f; --bad:#f0736b;
  --row:#12171e; --rowalt:#151b23; --rowhov:#1e2833;
  --mono:ui-monospace,"Cascadia Mono","Consolas",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:13.5px/1.45 "Inter","Segoe UI",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
input{font:inherit}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#2f3a47;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3d4a5a}
::-webkit-scrollbar-track{background:transparent}
.tnum{font-variant-numeric:tabular-nums;font-family:var(--mono)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;grid-template-rows:52px 1fr;
  grid-template-areas:"h h" "a m";height:100vh}
body.detail-open main{padding-right:460px}
@media(max-width:1100px){body.detail-open main{padding-right:0}}

header{grid-area:h;display:flex;align-items:center;gap:14px;padding:0 16px;height:52px;
  background:linear-gradient(90deg,#171e27,#0f141b);border-bottom:1px solid var(--line);z-index:20}
.logo{font-weight:800;letter-spacing:.4px;font-size:14px;white-space:nowrap}
.logo b{color:var(--accent)}
.logo span{color:var(--dim2);font-weight:500}
.tabs{display:flex;gap:2px;background:var(--bg3);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tab{padding:5px 14px;border-radius:6px;color:var(--dim);font-weight:600;font-size:13px}
.tab.active{background:var(--accent);color:#160c04}
.search{margin-left:auto;position:relative}
.search input{background:var(--bg3);border:1px solid var(--line);border-radius:9px;color:var(--txt);
  padding:8px 30px 8px 34px;width:300px;outline:none;transition:.15s}
.search input:focus{border-color:var(--accent);background:var(--bg4)}
.search .mag{position:absolute;left:10px;top:9px;opacity:.5}
.search kbd{position:absolute;right:9px;top:8px;font:11px var(--mono);color:var(--dim2);border:1px solid var(--line2);
  border-radius:4px;padding:1px 5px}
.viewtoggle{display:flex;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:3px}
.viewtoggle button{padding:5px 10px;border-radius:6px;color:var(--dim);font-size:15px;line-height:1}
.viewtoggle button.on{background:var(--bg4);color:var(--accent2)}

/* ---------- sidebar ---------- */
aside{grid-area:a;background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:6px 0}
.fg{border-bottom:1px solid var(--line)}
.fg>h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin:0;padding:11px 14px 11px;
  display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.fg>h3 .arw{margin-left:auto;transition:.15s;opacity:.5;font-size:10px}
.fg.collapsed>h3 .arw{transform:rotate(-90deg)}
.fg .body{padding:0 12px 12px}
.fg.collapsed .body{display:none}
.opt{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--dim)}
.opt:hover{background:var(--bg3);color:var(--txt)}
.opt.on{color:var(--txt)}
.opt .box{width:15px;height:15px;border:1.5px solid var(--line2);border-radius:4px;flex:0 0 15px;display:grid;place-items:center;font-size:11px}
.opt.on .box{background:var(--accent);border-color:var(--accent);color:#160c04}
.opt .ic{width:16px;height:16px;filter:brightness(1.3)}
.opt .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .cnt{font:11px var(--mono);color:var(--dim2)}
.opt.zero{opacity:.38;pointer-events:none}
/* range filter */
.range{margin:4px 0 14px}
.range .rl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:7px}
.range .rl b{color:var(--txt);font-family:var(--mono)}
.dual{position:relative;height:26px}
.dual .track{position:absolute;top:11px;left:0;right:0;height:4px;background:var(--bg4);border-radius:2px}
.dual .fill{position:absolute;top:11px;height:4px;background:var(--accent);border-radius:2px}
.dual input{position:absolute;top:0;left:0;width:100%;height:26px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:15px;height:15px;border-radius:50%;
  background:var(--accent);border:2px solid #0e1116;cursor:pointer;margin-top:0}
.dual input::-moz-range-thumb{pointer-events:auto;width:15px;height:15px;border-radius:50%;background:var(--accent);border:2px solid #0e1116;cursor:pointer}
.reset{margin:10px 12px;width:calc(100% - 24px);border:1px solid var(--line2);border-radius:7px;padding:8px;color:var(--dim)}
.reset:hover{color:var(--txt);border-color:var(--accent)}

/* ---------- main ---------- */
main{grid-area:m;overflow:auto;display:flex;flex-direction:column;min-width:0}
.chipsbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bg);z-index:12;min-height:46px}
.chipsbar .lead{color:var(--dim2);font-size:12px}
.achip{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--line2);border-radius:20px;
  padding:3px 6px 3px 11px;font-size:12.5px}
.achip b{color:var(--dim);font-weight:600}
.achip .x{width:17px;height:17px;border-radius:50%;background:var(--bg4);display:grid;place-items:center;color:var(--dim);font-size:12px}
.achip .x:hover{background:var(--bad);color:#fff}
.clearall{color:var(--accent2);font-size:12.5px;font-weight:600}
.count{margin-left:auto;color:var(--dim);font-size:12.5px;white-space:nowrap}
.scroll{overflow:auto;flex:1;min-height:0}

/* table */
table.db{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.db thead th{position:sticky;top:0;background:var(--bg2);color:var(--dim);font-weight:600;text-align:right;
  padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none;z-index:5;font-size:12px}
table.db thead th:first-child{text-align:left}
table.db thead th:hover{color:var(--txt)}
table.db thead th .sar{color:var(--accent);margin-left:3px}
table.db td{padding:0 12px;height:38px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.db td:first-child{text-align:left}
table.db tbody tr{background:var(--row);cursor:pointer}
table.db tbody tr:nth-child(even){background:var(--rowalt)}
table.db tbody tr:hover{background:var(--rowhov)}
table.db tbody tr.sel{box-shadow:inset 3px 0 0 var(--accent2)}
.cellname{display:flex;align-items:center;gap:9px}
.cellname .ic{width:26px;height:26px;background:var(--bg3);border-radius:6px;padding:2px;flex:0 0 26px;filter:brightness(1.25)}
.cellname .nm{font-weight:600}
.cellname .rk{font:10.5px var(--mono);color:var(--dim2)}
.tag-set{color:var(--accent2)} .tag-w{color:#ffce7a}
.statcell{position:relative}
.statcell .bar{position:absolute;left:0;bottom:5px;height:3px;border-radius:2px;opacity:.55}
.statcell.dim{color:var(--dim2)}
.cmpcol{width:34px;text-align:center!important}
.cmpbox{width:17px;height:17px;border:1.5px solid var(--line2);border-radius:4px;display:inline-grid;place-items:center;font-size:11px;color:transparent}
tr.sel .cmpbox,tr:hover .cmpbox{border-color:var(--dim)}
tr.sel .cmpbox{background:var(--accent2);border-color:var(--accent2);color:#04202b}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px;padding:14px 16px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;transition:.12s;position:relative}
.card:hover{border-color:var(--line2);background:var(--bg3)}
.card.sel{border-color:var(--accent2)}
.card .top{display:flex;gap:10px}
.card .ic{width:36px;height:36px;background:var(--bg3);border-radius:8px;padding:3px;flex:0 0 36px;filter:brightness(1.25)}
.card .nm{font-weight:700}
.card .sub{color:var(--dim);font-size:11.5px}
.card .bl{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.b{font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--bg3);border:1px solid var(--line);color:var(--dim)}
.b.set{color:var(--accent2);border-color:#2b4a5a}.b.w{color:#ffce7a;border-color:#4a4025}
.cstat{margin-top:5px}
.cstat .r{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;position:relative}
.cstat .r .bar{position:absolute;left:0;bottom:0;height:2px;opacity:.5}

.empty{color:var(--dim);text-align:center;padding:70px;font-size:15px}
.empty button{color:var(--accent2);font-weight:600;margin-top:10px;display:block;margin-inline:auto}

/* ---------- detail ---------- */
.detail{position:fixed;top:52px;right:0;bottom:0;width:460px;max-width:94vw;background:var(--bg2);
  border-left:1px solid var(--line);overflow-y:auto;z-index:30;display:none;
  box-shadow:-14px 0 44px rgba(0,0,0,.4)}
.detail.open{display:block}
.dhead{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;position:sticky;top:0;background:var(--bg2);z-index:3}
.dhead .ic{width:48px;height:48px;background:var(--bg3);border-radius:10px;padding:4px;filter:brightness(1.25)}
.dhead h2{margin:0;font-size:17px}
.dhead .k{color:var(--dim2);font:11px var(--mono);margin-top:3px}
.dx{margin-left:auto;color:var(--dim);font-size:22px;line-height:1;align-self:flex-start}
.dx:hover{color:var(--txt)}
.dbody{padding:14px 16px}
.desc{color:#bcc8d4;font-size:12.5px;font-style:italic;border-left:2px solid var(--accent);padding-left:10px;margin:0 0 14px}
.lvlbox{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:14px}
.lvlbox .lr{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim)}
.lvlbox .lvn{font-size:19px;font-weight:800;color:var(--accent);font-family:var(--mono)}
.lvlbox input[type=range]{width:100%;accent-color:var(--accent);margin:8px 0 2px}
.note{font-size:11px;color:var(--dim2);margin-top:6px;line-height:1.4}
.rar{display:flex;gap:6px;margin-top:10px}
.rar button{flex:1;border:1px solid var(--line);border-radius:6px;padding:6px;font-size:12px;font-weight:600;color:var(--dim)}
.rar button.on[data-r="1"]{background:var(--r1);color:#111;border-color:var(--r1)}
.rar button.on[data-r="2"]{background:var(--r2);color:#08260f;border-color:var(--r2)}
.rar button.on[data-r="3"]{background:var(--r3);color:#04202b;border-color:var(--r3)}
.sec{margin-bottom:16px}
.sec h4{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
.srow{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;position:relative}
.srow .si{width:17px;height:17px;filter:brightness(1.3)}
.srow .snm{flex:1;color:#c6cfd9}
.srow .sv{font-weight:700;font-family:var(--mono)}
.srow.up .sv{color:var(--accent)}
.srow .sbar{position:absolute;left:26px;bottom:1px;height:3px;border-radius:2px;opacity:.5}
.slot{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;margin-bottom:5px;border:1px solid var(--line);background:var(--bg3);font-size:12.5px}
.slot.locked{opacity:.45}
.slot .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.slot .snm{flex:1}
.slot .tg{font-size:10px;padding:1px 7px;border-radius:4px;font-weight:700;color:#111}
.subp{font-size:12px;color:#b7c2ce;padding:3px 0;display:flex;justify-content:space-between}
.subp span:last-child{color:var(--dim2);font:11px var(--mono)}

/* tooltip */
#tip{position:fixed;z-index:60;pointer-events:none;background:#0b0f14;border:1px solid var(--line2);border-radius:9px;
  padding:10px 12px;width:250px;box-shadow:0 12px 34px rgba(0,0,0,.55);display:none;font-size:12.5px}
#tip h5{margin:0 0 3px;font-size:13.5px}
#tip .k{font:10.5px var(--mono);color:var(--dim2);margin-bottom:7px}
#tip .tr{display:flex;justify-content:space-between;padding:1.5px 0;color:var(--dim)}
#tip .tr b{color:var(--txt);font-family:var(--mono)}
#tip .td{color:#aab6c2;font-style:italic;margin-top:6px;font-size:11.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* comparison */
.cmpbar{position:fixed;bottom:0;left:248px;right:0;background:var(--bg3);border-top:2px solid var(--accent2);
  padding:9px 16px;display:none;align-items:center;gap:12px;z-index:35}
.cmpbar.show{display:flex}
.cmpbar .its{display:flex;gap:7px;flex:1;flex-wrap:wrap}
.cmpbar .ci{background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:4px 9px;font-size:12px;display:flex;gap:7px;align-items:center}
.cmpbar .ci b{cursor:pointer;color:var(--dim)}.cmpbar .ci b:hover{color:var(--bad)}
.cmpbar .go{background:var(--accent2);color:#04202b;border-radius:7px;padding:8px 15px;font-weight:700}
.cmpbar .go.sec{background:var(--bg2);color:var(--dim)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;z-index:70;padding:38px}
.modal.open{display:flex;align-items:flex-start;justify-content:center}
.modal .box{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;max-width:1040px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px}
.modal h2{margin:0 0 14px}
.ct{width:100%;border-collapse:collapse;font-size:13px}
.ct th,.ct td{padding:8px 11px;text-align:right;border-bottom:1px solid var(--line);font-family:var(--mono)}
.ct th:first-child,.ct td:first-child{text-align:left;font-family:inherit}
.ct thead th{position:sticky;top:0;background:var(--bg2)}
.ct .best{color:var(--good);font-weight:800}.ct .worst{color:var(--bad)}
.ct tr:hover td{background:var(--rowhov)}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="logo"><b>PHANTOM BRIGADE</b> <span>· снаряжение</span></div>
    <div class="tabs">
      <button class="tab active" data-tab="items">Снаряжение</button>
      <button class="tab" data-tab="mods">Модификации</button>
    </div>
    <div class="search">
      <svg class="mag" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      <input id="q" placeholder="Поиск…" autocomplete="off"><kbd>/</kbd>
    </div>
    <div class="viewtoggle">
      <button data-view="table" title="Таблица">≣</button>
      <button data-view="cards" title="Карточки">⊞</button>
    </div>
  </header>

  <aside id="filters"></aside>

  <main>
    <div class="chipsbar" id="chips"></div>
    <div class="scroll" id="scroll"></div>
  </main>

  <div class="detail" id="detail"></div>
</div>

<div class="cmpbar" id="cmpbar">
  <b style="font-size:12.5px">Сравнение:</b><div class="its" id="cmpits"></div>
  <button class="go" id="cmpgo">Сравнить →</button>
  <button class="go sec" id="cmpclr">Очистить</button>
</div>
<div id="tip"></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

<script src="data.js"></script>
<script>
"use strict";
const D=window.PB_DATA, SM=D.statMeta, IC=D.icons;
const esc=s=>(s==null?'':(''+s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icon=(n,cls='ic')=>IC[n]?`<img class="${cls}" src="${IC[n]}" alt="">`:`<span class="${cls}"></span>`;
const RARN={1:'Обычное',2:'Необычное',3:'Редкое'}, RARC={1:'var(--r1)',2:'var(--r2)',3:'var(--r3)'};
const SLOTLBL=s=>({internal_aux_offense:'Наступление',internal_aux_defense:'Защита',internal_aux_mobility:'Мобильность',
  internal_aux_weapon:'Оружие',internal_aux_pilot:'Пилот',internal_aux_top_thrusters:'Двигатели',internal_aux_top_core:'Ядро'}[s]||s);
const HIDE=new Set(['scrap_value','comp2_value','comp3_value','wpn_proj_lifetime','wpn_proj_ricochet']);
const LOWER_BETTER=new Set(['mass','act_heat','wpn_scatter_angle','wpn_scatter_angle_moving','wpn_range_min','act_duration']);

// ---- prep ----
D.items.forEach(i=>{
  i._typeLabel=D.slots[i.slot]||i.slot;
  i._weightLabel=i.weight?D.weights[i.weight]:'';
  i._mnf=i.manufacturer?i.manufacturer.name:'';
  i._search=(i.name+' '+i.nameEn+' '+i.desc+' '+i.key+' '+(i.catName||'')+' '+(i.setName||'')+' '+i._mnf+' '+(i.tags||[]).join(' ')).toLowerCase();
});
D.modules.forEach(m=>{m._search=(m.name+' '+m.nameEn+' '+m.desc+' '+m.key+' '+(m.tags||[]).join(' ')).toLowerCase();});
const MNFS={}; D.items.forEach(i=>{if(i.manufacturer)MNFS[i.manufacturer.key]=i.manufacturer.name;});
const CATS={}; D.items.forEach(i=>{if(i.catName)CATS[i.catName]=i.catIcon;});
// global stat bounds (for bars + range sliders)
const BOUNDS={}; D.items.forEach(i=>{for(const k in i.stats){const v=i.stats[k];if(HIDE.has(k))continue;
  const b=BOUNDS[k]||(BOUNDS[k]={min:Infinity,max:-Infinity});b.min=Math.min(b.min,v);b.max=Math.max(b.max,v);}});
const barMax=k=>Math.max(1,Math.abs((BOUNDS[k]||{}).max||1));

// ---- state (persisted in URL hash) ----
const RANGES=[{k:'wpn_damage'},{k:'wpn_range_max'},{k:'act_heat'},{k:'mass'}];
const state={tab:'items',view:'table',q:'',
  f:{slot:new Set(),set:new Set(),weight:new Set(),cat:new Set(),mnf:new Set()},
  r:{}, modslot:new Set(),
  sort:{key:'name',dir:1}, level:1, rarity:1, open:null, cmp:new Set()};

function writeURL(push){
  const p=new URLSearchParams();
  p.set('tab',state.tab); p.set('view',state.view);
  if(state.q)p.set('q',state.q);
  for(const d in state.f) if(state.f[d].size) p.set(d,[...state.f[d]].join(','));
  for(const k in state.r){const r=state.r[k]; if(r) p.set('r_'+k,r[0]+'-'+r[1]);}
  if(state.modslot.size)p.set('ms',[...state.modslot].join(','));
  if(state.sort.key!=='name'||state.sort.dir!==1)p.set('sort',state.sort.key+':'+(state.sort.dir<0?'d':'a'));
  if(state.cmp.size)p.set('cmp',[...state.cmp].join(','));
  if(state.open)p.set('open',state.open);
  const h='#'+p.toString();
  history[push?'pushState':'replaceState'](null,'',h);
}
function readURL(){
  const p=new URLSearchParams(location.hash.slice(1));
  state.tab=p.get('tab')==='mods'?'mods':'items';
  state.view=p.get('view')==='cards'?'cards':'table';
  state.q=p.get('q')||'';
  for(const d in state.f){state.f[d]=new Set((p.get(d)||'').split(',').filter(Boolean));}
  state.r={}; RANGES.forEach(({k})=>{const v=p.get('r_'+k);if(v){const[a,b]=v.split('-').map(Number);if(!isNaN(a)&&!isNaN(b))state.r[k]=[a,b];}});
  state.modslot=new Set((p.get('ms')||'').split(',').filter(Boolean));
  const s=p.get('sort'); if(s){const[k,d]=s.split(':');state.sort={key:k,dir:d==='d'?-1:1};}
  state.cmp=new Set((p.get('cmp')||'').split(',').filter(Boolean));
  state.open=p.get('open')||null;
}

// ---- matching + counts ----
function inRanges(i,except){for(const k in state.r){if(k===except)continue;const[a,b]=state.r[k];const v=i.stats[k];if(v==null||v<a||v>b)return false;}return true;}
function matchItem(i,exceptDim){
  if(state.q&&!i._search.includes(state.q))return false;
  const f=state.f;
  if(exceptDim!=='slot'&&f.slot.size&&!f.slot.has(i.slot))return false;
  if(exceptDim!=='set'&&f.set.size&&!f.set.has(i.set))return false;
  if(exceptDim!=='weight'&&f.weight.size&&!f.weight.has(i.weight))return false;
  if(exceptDim!=='cat'&&f.cat.size&&!f.cat.has(i.catName))return false;
  if(exceptDim!=='mnf'&&f.mnf.size&&!(i.manufacturer&&f.mnf.has(i.manufacturer.key)))return false;
  if(!inRanges(i,exceptDim&&exceptDim.startsWith('r_')?exceptDim.slice(2):null))return false;
  return true;
}
function facetCount(dim,val){let n=0;for(const i of D.items){if(matchItem(i,dim)){
  if(dim==='slot'&&i.slot===val)n++;else if(dim==='set'&&i.set===val)n++;
  else if(dim==='weight'&&i.weight===val)n++;else if(dim==='cat'&&i.catName===val)n++;
  else if(dim==='mnf'&&i.manufacturer&&i.manufacturer.key===val)n++;}}return n;}

// ---- filters UI ----
function buildFilters(){
  const el=document.getElementById('filters');
  if(state.tab==='mods'){
    const slots={};D.modules.forEach(m=>m.slots.forEach(s=>slots[s]=true));
    el.innerHTML=fgroup('slot','Слот модуля',Object.keys(slots).map(k=>optHTML('modslot',k,SLOTLBL(k),null,
      D.modules.filter(m=>m.slots.includes(k)).length)))+resetBtn();
    return;
  }
  let h='';
  h+=fgroup('slot','Тип',Object.entries(D.slots).map(([k,v])=>optHTML('slot',k,v,null,facetCount('slot',k))));
  h+=fgroup('set','Набор',Object.entries(D.sets).map(([k,v])=>optHTML('set',k,v,null,facetCount('set',k))).filter((_,idx)=>true));
  h+=fgroup('weight','Вес',Object.entries(D.weights).map(([k,v])=>optHTML('weight',k,v,null,facetCount('weight',k))));
  h+=fgroup('cat','Категория',Object.keys(CATS).sort((a,b)=>a.localeCompare(b,'ru')).map(v=>optHTML('cat',v,v,CATS[v],facetCount('cat',v))));
  h+=fgroup('mnf','Производитель',Object.entries(MNFS).sort((a,b)=>a[1].localeCompare(b[1],'ru')).map(([k,v])=>optHTML('mnf',k,v,null,facetCount('mnf',k))));
  h+=fgroup('rng','Диапазоны',RANGES.map(r=>rangeHTML(r.k)).join(''),true);
  el.innerHTML=h+resetBtn();
  bindRanges();
}
const COLLAPSED=new Set();
function fgroup(id,title,opts,raw){
  const body=Array.isArray(opts)?opts.join(''):opts;
  return `<div class="fg ${COLLAPSED.has(id)?'collapsed':''}" data-fg="${id}"><h3>${title}<span class="arw">▼</span></h3><div class="body">${body}</div></div>`;
}
function optHTML(dim,key,label,ic,cnt){
  const on=(dim==='modslot'?state.modslot:state.f[dim]).has(key);
  return `<div class="opt ${on?'on':''} ${cnt===0&&!on?'zero':''}" data-dim="${dim}" data-key="${esc(key)}">
    <span class="box">${on?'✓':''}</span>${ic&&IC[ic]?`<img class="ic" src="${IC[ic]}">`:''}
    <span class="lbl">${esc(label)}</span><span class="cnt">${cnt}</span></div>`;
}
function rangeHTML(k){
  const b=BOUNDS[k]||{min:0,max:100};const lo=Math.floor(b.min),hi=Math.ceil(b.max);
  const cur=state.r[k]||[lo,hi];
  return `<div class="range" data-r="${k}"><div class="rl"><span>${esc(SM[k].name)}</span><b><span class="lv">${cur[0]}</span>–<span class="hv">${cur[1]}</span></b></div>
   <div class="dual"><div class="track"></div><div class="fill"></div>
     <input type="range" class="lo" min="${lo}" max="${hi}" value="${cur[0]}">
     <input type="range" class="hi" min="${lo}" max="${hi}" value="${cur[1]}"></div></div>`;
}
function bindRanges(){
  document.querySelectorAll('.range').forEach(rg=>{
    const k=rg.dataset.r,b=BOUNDS[k],lo=Math.floor(b.min),hi=Math.ceil(b.max);
    const iLo=rg.querySelector('.lo'),iHi=rg.querySelector('.hi'),fill=rg.querySelector('.fill');
    const upd=(commit)=>{let a=+iLo.value,c=+iHi.value;if(a>c){[a,c]=[c,a];}
      rg.querySelector('.lv').textContent=a;rg.querySelector('.hv').textContent=c;
      const span=hi-lo||1;fill.style.left=((a-lo)/span*100)+'%';fill.style.right=(100-(c-lo)/span*100)+'%';fill.style.width='auto';
      if(commit){if(a<=lo&&c>=hi)delete state.r[k];else state.r[k]=[a,c];render();writeURL();buildCountsOnly();}};
    iLo.oninput=()=>upd(false);iHi.oninput=()=>upd(false);
    iLo.onchange=()=>upd(true);iHi.onchange=()=>upd(true);
    upd(false);
  });
}
function buildCountsOnly(){ // refresh facet counts without losing slider drag focus
  document.querySelectorAll('.opt').forEach(o=>{const d=o.dataset.dim,k=o.dataset.key;if(d==='modslot')return;
    const c=facetCount(d,k);o.querySelector('.cnt').textContent=c;
    o.classList.toggle('zero',c===0&&!o.classList.contains('on'));});
}
function resetBtn(){return `<button class="reset" onclick="resetFilters()">Сбросить фильтры</button>`;}
function resetFilters(){for(const d in state.f)state.f[d].clear();state.r={};state.modslot.clear();state.q='';document.getElementById('q').value='';buildFilters();render();writeURL();}

document.getElementById('filters').addEventListener('click',e=>{

// ---- columns ----
const COL_WEAPON=['wpn_damage','wpn_impact','wpn_range_max','act_heat','mass'];
const COL_ARMOR=['hp','barrier','heat_dissipation','mass'];
const COL_BACK=['mass','heat_dissipation'];
function activeColumns(list){
  const c={weapon:0,armor:0,back:0};
  list.forEach(i=>{if(i.slot==='main_weapon'||i.slot==='secondary_weapon')c.weapon++;
    else if(i.slot==='back')c.back++;else c.armor++;});
  let stats;
  if(c.weapon>=c.armor&&c.weapon>=c.back)stats=COL_WEAPON;
  else if(c.armor>=c.back)stats=COL_ARMOR;
  else stats=COL_BACK;
  // if genuinely mixed, blend key stats
  if(c.weapon&&c.armor)stats=['wpn_damage','hp','barrier','act_heat','mass'];
  return stats;
}

// ---- render ----
function getList(){
  let l=D.items.filter(i=>matchItem(i));
  const {key,dir}=state.sort;
  if(key==='name')l.sort((a,b)=>a.name.localeCompare(b.name,'ru')*dir);
  else if(['_typeLabel','setName','_weightLabel','_mnf'].includes(key))
    l.sort((a,b)=>((a[key]||'')+'').localeCompare((b[key]||'')+'','ru')*dir);
  else l.sort((a,b)=>{const av=a.stats[key],bv=b.stats[key];
    if(av==null&&bv==null)return 0;if(av==null)return 1;if(bv==null)return -1;return(av-bv)*dir;});
  return l;
}
function render(){
  if(state.tab==='mods')return renderMods();
  const list=getList();
  renderChips(list.length);
  const sc=document.getElementById('scroll');
  if(!list.length){sc.innerHTML=`<div class="empty">Ничего не найдено<button onclick="resetFilters()">Сбросить фильтры</button></div>`;return;}
  sc.innerHTML=state.view==='table'?tableHTML(list):cardsHTML(list);
  syncSel();
}
function renderChips(n){
  const c=document.getElementById('chips');let chips=[];
  const LBL={slot:'Тип',set:'Набор',weight:'Вес',cat:'Категория',mnf:'Произв.'};
  const NAME={slot:k=>D.slots[k],set:k=>D.sets[k],weight:k=>D.weights[k],cat:k=>k,mnf:k=>MNFS[k]};
  for(const d in state.f)for(const k of state.f[d])chips.push({d,k,t:LBL[d],v:NAME[d](k)});
  for(const k in state.r)chips.push({d:'r_'+k,k,t:SM[k].name,v:state.r[k][0]+'–'+state.r[k][1]});
  if(state.q)chips.push({d:'q',k:'',t:'Поиск',v:'"'+state.q+'"'});
  c.innerHTML=(chips.length?`<span class="lead">Фильтры:</span>`:`<span class="lead">Все предметы</span>`)+
    chips.map(ch=>`<span class="achip"><b>${esc(ch.t)}:</b> ${esc(ch.v)} <span class="x" data-cx="${ch.d}" data-ck="${esc(ch.k)}">×</span></span>`).join('')+
    (chips.length?`<button class="clearall" onclick="resetFilters()">Сбросить всё</button>`:'')+

function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;}

// ---- formatting ----
function fmtStat(k,val,level){const m=SM[k]||{};let v=val;
  if(level&&m.perLevel)v=val*(1+m.perLevel*(level-1));v*=(m.multiplier||1);
  if(Number.isInteger(v)){}else if(m.rounded&&Math.abs(v)>=10)v=Math.round(v);else v=Math.round(v*100)/100;
  return m.percentage?v+'%':''+v;}
function statColor(k){const c=(SM[k]||{}).color;return c?`rgb(${c[0]*255|0},${c[1]*255|0},${c[2]*255|0})`:'var(--accent2)';}

function statIcon(k){return SM[k]&&SM[k].icon?SM[k].icon:null;}

    return i?`<span class="ci">${esc(i.name)} <b data-x="${k}">×</b></span>`:'';}).join('');}
document.getElementById('cmpits').addEventListener('click',e=>{if(e.target.dataset.x)toggleCmp(e.target.dataset.x);});
document.getElementById('cmpclr').onclick=()=>{state.cmp.clear();updateCmp();writeURL();syncSel();document.querySelectorAll('[data-cmp]').forEach(b=>b.textContent='');};
document.getElementById('cmpgo').onclick=()=>{
  const items=[...state.cmp].map(k=>D.items.find(x=>x.key===k)).filter(Boolean);
  if(items.length<2){alert('Выберите минимум 2 предмета.');return;}
  const keys=[...new Set(items.flatMap(i=>Object.keys(i.stats)))].filter(k=>!HIDE.has(k)).sort((a,b)=>((SM[b]||{}).priority||0)-((SM[a]||{}).priority||0));
  let h=`<h2>Сравнение — ${items.length} ${plural(items.length,'предмет','предмета','предметов')}</h2><table class="ct"><thead><tr><th>Характеристика</th>${items.map(i=>`<th>${esc(i.name)}</th>`).join('')}</tr></thead><tbody>`;
  keys.forEach(k=>{const vals=items.map(i=>i.stats[k]);const nums=vals.filter(v=>v!=null);
    const inv=LOWER_BETTER.has(k);const best=inv?Math.min(...nums):Math.max(...nums);const worst=inv?Math.max(...nums):Math.min(...nums);
    h+=`<tr><td>${statName(k)}</td>${vals.map(v=>v==null?'<td style="color:var(--dim2)">—</td>':`<td class="${nums.length>1&&v===best?'best':(nums.length>1&&v===worst?'worst':'')}">${fmtStat(k,v)}</td>`).join('')}</tr>`;});
  h+=`</tbody></table><p class="note">Зелёным — лучшее в строке, красным — худшее (для массы/тепла/разброса «лучше» = меньше). Уровень = 1.</p>`;
  document.getElementById('mbox').innerHTML=h;document.getElementById('modal').classList.add('open');
};
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open');};

// ---- tooltip ----
const tip=document.getElementById('tip');
document.getElementById('scroll').addEventListener('mouseover',e=>{
  const r=e.target.closest('[data-key]');if(!r||e.target.closest('[data-cmp]'))return;
  const src=state.tab==='mods'?D.modules:D.items;const i=src.find(x=>x.key===r.dataset.key);if(!i)return;
  const stats=(state.tab==='mods'?Object.keys(i.stats):activeColumns([i])).filter(k=>i.stats[k]!=null&&!HIDE.has(k)).slice(0,6);
  tip.innerHTML=`<h5>${esc(i.name)}</h5><div class="k">${esc(i._typeLabel||i.slots&&i.slots.map(SLOTLBL).join(', ')||'')}${i.setName?' · '+esc(i.setName):''}</div>
    ${stats.map(k=>`<div class="tr"><span>${statName(k)}</span><b>${fmtStat(k,i.stats[k])}</b></div>`).join('')}
    ${i.desc?`<div class="td">${esc(i.desc)}</div>`:''}`;
  tip.style.display='block';
});
document.getElementById('scroll').addEventListener('mousemove',e=>{
  if(tip.style.display!=='block')return;const pad=16;let x=e.clientX+pad,y=e.clientY+pad;
  const r=tip.getBoundingClientRect();if(x+r.width>innerWidth)x=e.clientX-r.width-pad;if(y+r.height>innerHeight)y=e.clientY-r.height-pad;
  tip.style.left=x+'px';tip.style.top=y+'px';});
document.getElementById('scroll').addEventListener('mouseout',e=>{if(!e.relatedTarget||!e.relatedTarget.closest('[data-key]'))tip.style.display='none';});

// ---- tabs / view / search ----
function setTab(t){state.tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));
  closeDetail();buildFilters();render();writeURL();}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setTab(t.dataset.tab));
function setView(v){state.view=v;document.querySelectorAll('.viewtoggle button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));render();writeURL();}
document.querySelectorAll('.viewtoggle button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
let qt;document.getElementById('q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value.toLowerCase().trim();render();writeURL();if(state.tab==='items')buildCountsOnly();},130);};
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.id!=='q'){e.preventDefault();document.getElementById('q').focus();}
  if(e.key==='Escape'){if(document.getElementById('modal').classList.contains('open'))document.getElementById('modal').classList.remove('open');
    else if(state.open)closeDetail();else{document.getElementById('q').blur();}}
});
window.addEventListener('popstate',()=>{readURL();applyURL();});

// ---- boot ----
function applyURL(){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.tab));
  document.querySelectorAll('.viewtoggle button').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view));
  document.getElementById('q').value=state.q;
  buildFilters();updateCmp();render();
  if(state.open){const src=state.tab==='mods'?D.modules:D.items;const it=src.find(x=>x.key===state.open);
    if(it){openPanel();state.tab==='mods'?openModRaw(it):renderDetail(it);}}
  else closePanel();
}
function openModRaw(m){state.open=m.key;openMod(m.key);} // reuse
readURL();applyURL();
</script>
</body>
</html>
