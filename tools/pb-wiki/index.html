<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phantom Brigade — База снаряжения</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="logo"><b>PHANTOM BRIGADE</b> <span>· снаряжение</span></div>
    <div class="tabs">
      <button class="tab active" data-tab="items">Снаряжение</button>
      <button class="tab" data-tab="mods">Модификации</button>
    </div>
    <div class="search">
      <svg class="mag" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      <input id="q" placeholder="Поиск…" autocomplete="off"><kbd>/</kbd>
    </div>
    <div class="viewtoggle">
      <button data-view="table" title="Таблица">≣</button>
      <button data-view="cards" title="Карточки">⊞</button>
    </div>
  </header>

  <aside id="filters"></aside>

  <main>
    <div class="chipsbar" id="chips"></div>
    <div class="scroll" id="scroll"></div>
  </main>

  <div class="detail" id="detail"></div>
</div>

<div class="cmpbar" id="cmpbar">
  <b style="font-size:12.5px">Сравнение:</b><div class="its" id="cmpits"></div>
  <button class="go" id="cmpgo">Сравнить →</button>
  <button class="go sec" id="cmpclr">Очистить</button>
</div>
<div id="tip"></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

<script src="data.js"></script>
<script src="core.js"></script>
<script src="filters.js"></script>
<script>
"use strict";
// ---- render ----
function getList(){
  let l=D.items.filter(i=>matchItem(i));
  const {key,dir}=state.sort;
  if(key==='name')l.sort((a,b)=>a.name.localeCompare(b.name,'ru')*dir);
  else if(['_typeLabel','setName','_weightLabel','_mnf'].includes(key))
    l.sort((a,b)=>((a[key]||'')+'').localeCompare((b[key]||'')+'','ru')*dir);
  else l.sort((a,b)=>{const av=a.stats[key],bv=b.stats[key];
    if(av==null&&bv==null)return 0;if(av==null)return 1;if(bv==null)return -1;return(av-bv)*dir;});
  return l;
}
function render(){
  if(state.tab==='mods')return renderMods();
  const list=getList();
  renderChips(list.length);
  const sc=document.getElementById('scroll');
  if(!list.length){sc.innerHTML=`<div class="empty">Ничего не найдено<button onclick="resetFilters()">Сбросить фильтры</button></div>`;return;}
  sc.innerHTML=state.view==='table'?tableHTML(list):cardsHTML(list);
  syncSel();
}
function renderChips(n){
  const c=document.getElementById('chips');let chips=[];
  const LBL={slot:'Тип',set:'Набор',weight:'Вес',cat:'Категория',mnf:'Произв.'};
  const NAME={slot:k=>D.slots[k],set:k=>D.sets[k],weight:k=>D.weights[k],cat:k=>k,mnf:k=>MNFS[k]};
  for(const d in state.f)for(const k of state.f[d])chips.push({d,k,t:LBL[d],v:NAME[d](k)});
  for(const k in state.r)chips.push({d:'r_'+k,k,t:SM[k].name,v:state.r[k][0]+'–'+state.r[k][1]});
  if(state.q)chips.push({d:'q',k:'',t:'Поиск',v:'"'+state.q+'"'});
  c.innerHTML=(chips.length?`<span class="lead">Фильтры:</span>`:`<span class="lead">Все предметы</span>`)+
    chips.map(ch=>`<span class="achip"><b>${esc(ch.t)}:</b> ${esc(ch.v)} <span class="x" data-cx="${ch.d}" data-ck="${esc(ch.k)}">×</span></span>`).join('')+
    (chips.length?`<button class="clearall" onclick="resetFilters()">Сбросить всё</button>`:'')+
    `<span class="count">${n} ${plural(n,'предмет','предмета','предметов')}</span>`;
}
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;}
document.getElementById('chips').addEventListener('click',e=>{
  const x=e.target.closest('[data-cx]');if(!x)return;
  const d=x.dataset.cx,k=x.dataset.ck;
  if(d==='q'){state.q='';document.getElementById('q').value='';}
  else if(d.startsWith('r_'))delete state.r[d.slice(2)];
  else state.f[d].delete(k);
  buildFilters();render();writeURL();
});

function statCell(i,k){
  const v=i.stats[k];
  if(v==null)return `<td class="statcell dim">—</td>`;
  const w=Math.min(100,Math.abs(v)/barMax(k)*100);const col=statColor(k);
  return `<td class="statcell tnum">${fmtStat(k,v)}<span class="bar" style="width:${w}%;background:${col}"></span></td>`;
}
function tableHTML(list){
  const stats=activeColumns(list);
  const base=[['name','Название'],['_typeLabel','Тип'],['setName','Набор'],['_weightLabel','Вес']];
  const tail=[['_mnf','Произв.']];
  const cols=[...base,...stats.map(k=>[k,SM[k].name]),...tail];
  const th=`<th class="cmpcol"></th>`+cols.map(([k,l])=>{
    const on=state.sort.key===k;return `<th data-sort="${k}">${esc(l)}${on?`<span class="sar">${state.sort.dir<0?'▼':'▲'}</span>`:''}</th>`;}).join('');
  const rows=list.map(i=>`<tr data-key="${i.key}">
    <td class="cmpcol"><span class="cmpbox" data-cmp="${i.key}">${state.cmp.has(i.key)?'✓':''}</span></td>
    <td><div class="cellname">${icon(i.catIcon)}<div><div class="nm">${esc(i.name)}</div><div class="rk">${esc(i.catName||'')}</div></div></div></td>
    <td>${esc(i._typeLabel)}</td>
    <td class="${i.setName?'tag-set':''}">${esc(i.setName||'—')}</td>
    <td class="${i.weight?'tag-w':''}">${esc(i._weightLabel||'—')}</td>
    ${stats.map(k=>statCell(i,k)).join('')}
    <td class="dim" style="color:var(--dim)">${esc(i._mnf||'—')}</td></tr>`).join('');
  return `<table class="db"><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table>`;
}
function cardsHTML(list){
  return `<div class="grid">`+list.map(i=>{
    const stats=activeColumns([i]).filter(k=>i.stats[k]!=null).slice(0,4);
    return `<div class="card" data-key="${i.key}">
      <div class="top">${icon(i.catIcon)}
        <div style="flex:1"><div class="nm">${esc(i.name)}</div><div class="sub">${esc(i._typeLabel)}${i.catName?' · '+esc(i.catName):''}</div></div>
        <span class="cmpbox" data-cmp="${i.key}" style="align-self:start">${state.cmp.has(i.key)?'✓':''}</span></div>
      <div class="bl">${i.setName?`<span class="b set">${esc(i.setName)}</span>`:''}${i.weight?`<span class="b w">${esc(i._weightLabel)}</span>`:''}${i._mnf?`<span class="b">${esc(i._mnf)}</span>`:''}</div>
      <div class="cstat">${stats.map(k=>{const w=Math.min(100,Math.abs(i.stats[k])/barMax(k)*100);
        return `<div class="r"><span>${esc(SM[k].name)}</span><b class="tnum">${fmtStat(k,i.stats[k])}</b><span class="bar" style="width:${w}%;background:${statColor(k)}"></span></div>`;}).join('')}</div>
    </div>`;}).join('')+`</div>`;
}
document.getElementById('scroll').addEventListener('click',e=>{
  const cmp=e.target.closest('[data-cmp]');if(cmp){e.stopPropagation();toggleCmp(cmp.dataset.cmp);return;}
  const th=e.target.closest('[data-sort]');if(th){const k=th.dataset.sort;
    if(state.sort.key===k)state.sort.dir*=-1;else state.sort={key:k,dir:k==='name'||['_typeLabel','setName','_weightLabel','_mnf'].includes(k)?1:-1};
    render();writeURL();return;}
  const row=e.target.closest('[data-key]');if(row){state.tab==='mods'?openMod(row.dataset.key):openItem(row.dataset.key);}
});

// ---- detail ----
function openPanel(){document.getElementById('detail').classList.add('open');document.body.classList.add('detail-open');}
function closePanel(){document.getElementById('detail').classList.remove('open');document.body.classList.remove('detail-open');}
function openItem(key){const i=D.items.find(x=>x.key===key);if(!i)return;
  state.open=key;state.level=1;state.rarity=1;renderDetail(i);openPanel();writeURL(true);syncSel();}
function closeDetail(){state.open=null;closePanel();writeURL();syncSel();}
function syncSel(){document.querySelectorAll('tr[data-key],.card[data-key]').forEach(r=>{
  r.classList.toggle('sel',state.cmp.has(r.dataset.key));
  if(r.tagName==='TR')r.classList.toggle('sel',state.cmp.has(r.dataset.key));});
  document.querySelectorAll('[data-key]').forEach(r=>{if(r.dataset.key===state.open)r.style.background='var(--rowhov)';});}
function renderDetail(i){
  const scale=new Set(D.levelScaling.stats);
  const keys=Object.keys(i.stats).filter(k=>!HIDE.has(k)).sort((a,b)=>((SM[b]||{}).priority||0)-((SM[a]||{}).priority||0));
  const isArmor=['torso','legs','arm'].includes(i.slot);
  const d=document.getElementById('detail');
  d.innerHTML=`<div class="dhead">${icon(i.catIcon)}<div><h2>${esc(i.name)}</h2><div class="k">${esc(i.key)}${i.nameEn?' · '+esc(i.nameEn):''}</div></div><button class="dx" onclick="closeDetail()">×</button></div>
   <div class="dbody">${i.desc?`<p class="desc">${esc(i.desc)}</p>`:''}
    <div class="lvlbox"><div class="lr"><span>Уровень предмета</span><span class="lvn" id="lvn">1</span></div>
      <input type="range" id="lvl" min="1" max="${D.levelScaling.limit}" value="1">
      <div class="lr"><span>ур.1 (база)</span><span>макс. ${D.levelScaling.limit}</span></div>
      <div class="note">Масштабирует только: ${D.levelScaling.stats.map(statName).join(', ')} (+${D.levelScaling.increase*100}%/ур., линейно).</div>
      <div class="rar"><button data-r="1" class="on">Обычное</button><button data-r="2">Необычное</button><button data-r="3">Редкое</button></div></div>
    <div class="sec"><h4>Характеристики</h4><div id="statlist"></div>
      ${isArmor?'<div class="note">Для брони барьер/HP/масса — доля от запаса набора (как в файлах игры).</div>':''}</div>
    ${i.moduleSlots&&i.moduleSlots.length?`<div class="sec"><h4>Слоты модификаций</h4><div id="slotlist"></div><div class="note">Цвет = мин. редкость, при которой слот доступен.</div></div>`:''}
    ${i.subsystems&&i.subsystems.length?`<div class="sec"><h4>Состав</h4>${i.subsystems.map(s=>`<div class="subp"><span>${esc(s.name)}</span><span>${esc(s.hardpoint)}</span></div>`).join('')}</div>`:''}
    ${i.specs&&i.specs.length?`<div class="sec"><h4>Особенности</h4><div class="bl">${i.specs.map(s=>`<span class="b">${esc(s.name)}</span>`).join('')}</div></div>`:''}</div>`;
  const lvl=d.querySelector('#lvl');lvl.oninput=()=>{state.level=+lvl.value;d.querySelector('#lvn').textContent=lvl.value;drawStats(i);};
  d.querySelectorAll('.rar button').forEach(b=>b.onclick=()=>{state.rarity=+b.dataset.r;
    d.querySelectorAll('.rar button').forEach(x=>x.classList.toggle('on',x===b));drawSlots(i);});
  drawStats(i);drawSlots(i);
}
function drawStats(i){const box=document.getElementById('statlist');if(!box)return;
  const scale=new Set(D.levelScaling.stats);
  const keys=Object.keys(i.stats).filter(k=>!HIDE.has(k)).sort((a,b)=>((SM[b]||{}).priority||0)-((SM[a]||{}).priority||0));
  box.innerHTML=keys.map(k=>{const up=scale.has(k)&&state.level>1;const si=statIcon(k);
    const w=Math.min(100,Math.abs(i.stats[k]*(up?(1+0.25*(state.level-1)):1))/barMax(k)*100);
    return `<div class="srow ${up?'up':''}">${si&&IC[si]?`<img class="si" src="${IC[si]}">`:'<span class="si"></span>'}
      <span class="snm">${statName(k)}</span><span class="sv">${fmtStat(k,i.stats[k],state.level)}${up?' ↑':''}</span>
      <span class="sbar" style="width:${w}%;background:${statColor(k)}"></span></div>`;}).join('');
}
function drawSlots(i){const box=document.getElementById('slotlist');if(!box)return;
  box.innerHTML=(i.moduleSlots||[]).map(s=>{const r=Math.max(1,s.ratingMin);const col=RARC[r];const avail=r<=state.rarity;
    return `<div class="slot ${avail?'':'locked'}"><span class="dot" style="background:${col}"></span>
      <span class="snm">${SLOTLBL(s.hardpoint)}${s.default?` · <span style="color:var(--dim2)">${esc(s.default.name)}</span>`:''}</span>
      <span class="tg" style="background:${col}">${r>1?RARN[r]:'база'}</span></div>`;}).join('');
}

// ---- modules ----
function renderMods(){
  const c=document.getElementById('chips');
  let fam={};D.modules.forEach(m=>{if(state.q&&!m._search.includes(state.q))return;
    if(state.modslot.size&&!m.slots.some(s=>state.modslot.has(s)))return;(fam[m.family]=fam[m.family]||[]).push(m);});
  const fams=Object.values(fam).sort((a,b)=>a[0].name.localeCompare(b[0].name,'ru'));
  c.innerHTML=`<span class="lead">Модификации — вставляются в слоты снаряжения</span>`+
    (state.modslot.size?`<button class="clearall" onclick="resetFilters()">Сбросить</button>`:'')+
    `<span class="count">${fams.length} ${plural(fams.length,'семейство','семейства','семейств')}</span>`;
  const sc=document.getElementById('scroll');
  if(!fams.length){sc.innerHTML=`<div class="empty">Ничего не найдено</div>`;return;}
  sc.innerHTML=`<div class="grid">`+fams.map(ms=>{const m=ms[0];
    const eff=Object.keys(m.stats).filter(k=>!HIDE.has(k)).slice(0,4);
    const tiers=ms.slice().sort((a,b)=>(a.tier>b.tier?1:-1)).map(x=>x.tier?x.tier.toUpperCase():'·');
    return `<div class="card" data-key="${m.key}"><div class="top">${icon('s_icon_l32_part_arch_all')}
      <div style="flex:1"><div class="nm">${esc(m.name)}</div><div class="sub">${ms[0].slots.map(SLOTLBL).join(', ')}</div></div></div>
      <div class="bl">${tiers.map(t=>`<span class="b">${t}</span>`).join('')}</div>
      <div class="cstat">${eff.map(k=>`<div class="r"><span>${statName(k)}</span><b class="tnum">${fmtStat(k,m.stats[k])}</b></div>`).join('')}</div></div>`;}).join('')+`</div>`;
}
function openMod(key){const m=D.modules.find(x=>x.key===key);if(!m)return;
  const fam=D.modules.filter(x=>x.family===m.family).sort((a,b)=>(a.tier>b.tier?1:-1));
  const d=document.getElementById('detail');
  d.innerHTML=`<div class="dhead">${icon('s_icon_l32_part_arch_all')}<div><h2>${esc(m.name)}</h2><div class="k">${esc(m.family)} · ${m.slots.map(SLOTLBL).join(', ')}</div></div><button class="dx" onclick="closeDetail()">×</button></div>
   <div class="dbody">${m.desc?`<p class="desc">${esc(m.desc)}</p>`:''}
    ${fam.map(x=>`<div class="sec"><h4>${x.tier?'Тир '+x.tier.toUpperCase():'Базовый'}</h4>
      ${Object.keys(x.stats).filter(k=>!HIDE.has(k)).map(k=>`<div class="srow"><span class="snm">${statName(k)}</span><span class="sv">${fmtStat(k,x.stats[k])}</span></div>`).join('')||'<div class="note">нет числовых эффектов</div>'}</div>`).join('')}</div>`;
  state.open=key;openPanel();writeURL(true);
}

// ---- comparison ----
function toggleCmp(key){state.cmp.has(key)?state.cmp.delete(key):state.cmp.add(key);updateCmp();writeURL();syncSel();
  document.querySelectorAll(`[data-cmp="${CSS.escape(key)}"]`).forEach(b=>b.textContent=state.cmp.has(key)?'✓':'');}
function updateCmp(){const bar=document.getElementById('cmpbar');bar.classList.toggle('show',state.cmp.size>0);
  document.getElementById('cmpits').innerHTML=[...state.cmp].map(k=>{const i=D.items.find(x=>x.key===k);
    return i?`<span class="ci">${esc(i.name)} <b data-x="${k}">×</b></span>`:'';}).join('');}
document.getElementById('cmpits').addEventListener('click',e=>{if(e.target.dataset.x)toggleCmp(e.target.dataset.x);});
document.getElementById('cmpclr').onclick=()=>{state.cmp.clear();updateCmp();writeURL();syncSel();document.querySelectorAll('[data-cmp]').forEach(b=>b.textContent='');};
document.getElementById('cmpgo').onclick=()=>{
  const items=[...state.cmp].map(k=>D.items.find(x=>x.key===k)).filter(Boolean);
  if(items.length<2){alert('Выберите минимум 2 предмета.');return;}
  const keys=[...new Set(items.flatMap(i=>Object.keys(i.stats)))].filter(k=>!HIDE.has(k)).sort((a,b)=>((SM[b]||{}).priority||0)-((SM[a]||{}).priority||0));
  let h=`<h2>Сравнение — ${items.length} ${plural(items.length,'предмет','предмета','предметов')}</h2><table class="ct"><thead><tr><th>Характеристика</th>${items.map(i=>`<th>${esc(i.name)}</th>`).join('')}</tr></thead><tbody>`;
  keys.forEach(k=>{const vals=items.map(i=>i.stats[k]);const nums=vals.filter(v=>v!=null);
    const inv=LOWER_BETTER.has(k);const best=inv?Math.min(...nums):Math.max(...nums);const worst=inv?Math.max(...nums):Math.min(...nums);
    h+=`<tr><td>${statName(k)}</td>${vals.map(v=>v==null?'<td style="color:var(--dim2)">—</td>':`<td class="${nums.length>1&&v===best?'best':(nums.length>1&&v===worst?'worst':'')}">${fmtStat(k,v)}</td>`).join('')}</tr>`;});
  h+=`</tbody></table><p class="note">Зелёным — лучшее в строке, красным — худшее (для массы/тепла/разброса «лучше» = меньше). Уровень = 1.</p>`;
  document.getElementById('mbox').innerHTML=h;document.getElementById('modal').classList.add('open');
};
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open');};

// ---- tooltip ----
const tip=document.getElementById('tip');
document.getElementById('scroll').addEventListener('mouseover',e=>{
  const r=e.target.closest('[data-key]');if(!r||e.target.closest('[data-cmp]'))return;
  const src=state.tab==='mods'?D.modules:D.items;const i=src.find(x=>x.key===r.dataset.key);if(!i)return;
  const stats=(state.tab==='mods'?Object.keys(i.stats):activeColumns([i])).filter(k=>i.stats[k]!=null&&!HIDE.has(k)).slice(0,6);
  tip.innerHTML=`<h5>${esc(i.name)}</h5><div class="k">${esc(i._typeLabel||i.slots&&i.slots.map(SLOTLBL).join(', ')||'')}${i.setName?' · '+esc(i.setName):''}</div>
    ${stats.map(k=>`<div class="tr"><span>${statName(k)}</span><b>${fmtStat(k,i.stats[k])}</b></div>`).join('')}
    ${i.desc?`<div class="td">${esc(i.desc)}</div>`:''}`;
  tip.style.display='block';
});
document.getElementById('scroll').addEventListener('mousemove',e=>{
  if(tip.style.display!=='block')return;const pad=16;let x=e.clientX+pad,y=e.clientY+pad;
  const r=tip.getBoundingClientRect();if(x+r.width>innerWidth)x=e.clientX-r.width-pad;if(y+r.height>innerHeight)y=e.clientY-r.height-pad;
  tip.style.left=x+'px';tip.style.top=y+'px';});
document.getElementById('scroll').addEventListener('mouseout',e=>{if(!e.relatedTarget||!e.relatedTarget.closest('[data-key]'))tip.style.display='none';});

// ---- tabs / view / search ----
function setTab(t){state.tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));
  closeDetail();buildFilters();render();writeURL();}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setTab(t.dataset.tab));
function setView(v){state.view=v;document.querySelectorAll('.viewtoggle button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));render();writeURL();}
document.querySelectorAll('.viewtoggle button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
let qt;document.getElementById('q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value.toLowerCase().trim();render();writeURL();if(state.tab==='items')buildCountsOnly();},130);};
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.id!=='q'){e.preventDefault();document.getElementById('q').focus();}
  if(e.key==='Escape'){if(document.getElementById('modal').classList.contains('open'))document.getElementById('modal').classList.remove('open');
    else if(state.open)closeDetail();else{document.getElementById('q').blur();}}
});
window.addEventListener('popstate',()=>{readURL();applyURL();});

// ---- boot ----
function applyURL(){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.tab));
  document.querySelectorAll('.viewtoggle button').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view));
  document.getElementById('q').value=state.q;
  buildFilters();updateCmp();render();
  if(state.open){const src=state.tab==='mods'?D.modules:D.items;const it=src.find(x=>x.key===state.open);
    if(it){openPanel();state.tab==='mods'?openModRaw(it):renderDetail(it);}}
  else closePanel();
}
function openModRaw(m){state.open=m.key;openMod(m.key);} // reuse
readURL();applyURL();
</script>
</body>
</html>
